name: Build APK

# Every push to main builds and runs the unit tests. A manual run with release_tag = vX.Y.Z
# also signs the APKs and latest.json with the release GPG key and publishes them as a GitHub
# release, which ethavpn-app-publish on the server then verifies and serves from /dl/.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Unit tests (compiles everything; runs before the keystore so a push without secrets still tells)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testDirectDebugUnitTest --tests 'com.v2ray.ang.handler.*' --tests 'com.v2ray.ang.ui.*'   # the fork's tests; upstream's UtilsTest needs Android stubs

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew licenseDirectReleaseReport
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Write latest.json and the signing certificate fingerprint
      run: |
        set -euo pipefail
        OUT=${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release
        cd "$OUT"
        VERSION=$(grep -oP 'versionName = "\K[^"]+' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts)
        CODE=$(grep -oP 'versionCode = \K[0-9]+' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts)
        MIN=$(tr -d ' \n' < ${{ github.workspace }}/min_supported.txt 2>/dev/null || echo "$VERSION")
        NOTES=$( (cat ${{ github.workspace }}/RELEASE_NOTES.md 2>/dev/null || true) | head -c 1500 | jq -Rs .)
        ASSETS=$(for f in SkyRay_*.apk; do
          abi=${f#SkyRay_${VERSION}_}; abi=${abi%.apk}      # arm64-v8a, armeabi-v7a, x86, x86_64, universal
          printf '{"abi":"%s","name":"%s","size":%s,"sha256":"%s"}\n' "$abi" "$f" "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
        done | jq -s .)
        jq -n --arg v "$VERSION" --argjson c "$CODE" --arg p "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg m "$MIN" --argjson n "$NOTES" --argjson a "$ASSETS" \
          '{version:$v, versionCode:$c, published:$p, min_supported:$m, notes:$n, assets:$a}' > latest.json
        cat latest.json
        # the release certificate's SHA-256: goes into assetlinks.json on the server (App Links)
        $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs SkyRay_${VERSION}_arm64-v8a.apk \
          | grep -i 'SHA-256' | head -1 | sed -E 's/.*: *//' | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//' > signing-cert-sha256.txt
        echo "signing cert sha256: $(cat signing-cert-sha256.txt)"
        echo "### EthaVPN $VERSION" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY; cat latest.json >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
        echo "Signing certificate SHA-256: \`$(cat signing-cert-sha256.txt)\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload APKs and metadata
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: release-files
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/SkyRay_*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/latest.json
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/signing-cert-sha256.txt

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Sign APKs and latest.json
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          # a key with a passphrase: GPG_PASSPHRASE secret; without one the variable is empty
          PASS_ARGS=()
          if [ -n "$GPG_PASSPHRASE" ]; then PASS_ARGS=(--pinentry-mode loopback --passphrase-fd 3); fi
          mkdir -p release-files
          for f in release/SkyRay_*.apk release/latest.json; do
            cp "$f" release-files/
            gpg --batch --yes "${PASS_ARGS[@]}" --local-user "$KEY" --detach-sign --output "release-files/$(basename "$f").sig" "$f" 3<<<"$GPG_PASSPHRASE"
          done
          cp release/signing-cert-sha256.txt release-files/
          gpg --armor --export "$KEY" > release-files/ethavpn-release-key.asc
          echo "release key fingerprint: $KEY" | tee release-files/release-key-fingerprint.txt
          ls -la release-files

      - name: Upload to the GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: false
