name: Build APK and Play bundle

# Every push to main builds (the direct APKs and the Play bundle) and runs the unit tests. A manual
# run with release_tag = vX.Y.Z also signs the APKs, the bundle and latest.json with the release GPG
# key and publishes them as a GitHub release: ethavpn-app-publish on the server verifies and serves
# the APKs from /dl/; SkyRay_<version>_play.aab is what goes into the Google Play Console by hand.
#
# Two signing keys. The Allion LLC key (ALLION_* secrets) signs the Play bundle (Google Play's upload key) and is the
# direct APKs' signer on Android 9+, through APK Signature Scheme v3 key rotation from the Ethavpn key (APP_KEYSTORE_*
# secrets): phones that installed an Ethavpn-signed SkyRay accept the update and trust the Allion key from then on.
# Android 7-8 cannot rotate, so the direct APKs keep an Ethavpn v2 signature for them. Both keys are needed forever.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main
      - 'claude/**'   # work in progress, pushed from the server, which cannot start a run by hand: built and tested, never released

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    # The core library is built here from the AndroidLibXrayLite submodule (the commit it pins, which was
    # upstream's prebuilt libv2ray.aar before) with one file of ours added, echfetch/echfetch.go: the
    # subscription fetch with Encrypted Client Hello (echfetch/README.md). Cached by the submodule commit,
    # that file's content and the NDK, so it is rebuilt only when one of them changes (about three minutes).
    - name: Setup Go (the core library's own version)
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache-dependency-path: AndroidLibXrayLite/go.sum

    - name: Test the ECH fetch (standard library only, in a scratch module)
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/echmod" && cp echfetch/*.go "$RUNNER_TEMP/echmod/"
        cd "$RUNNER_TEMP/echmod"
        printf 'module example.invalid/libv2ray\n\ngo 1.24\n' > go.mod   # the fetch needs Go 1.23 or newer
        {
          gofmt -l . | tee /dev/stderr | { ! grep -q .; }
          go vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...            # the iOS app compiles the same files
          go test -count=1 ./...
        } 2>&1 | tee "$RUNNER_TEMP/go-test.log"

    - name: Restore cached libv2ray
      id: cache-libv2ray-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar
        key: libv2ray-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}-${{ hashFiles('echfetch/echfetch.go') }}

    - name: Build libv2ray from the submodule with the ECH fetch
      if: steps.cache-libv2ray-restore.outputs.cache-hit != 'true'
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
      run: |
        set -euo pipefail
        cp echfetch/echfetch.go AndroidLibXrayLite/
        cd AndroidLibXrayLite
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH="$PATH:$(go env GOPATH)/bin"
        # upstream's own recipe (its .github/workflows/main.yml): the geo files into assets/, then bind
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        gomobile init
        go mod tidy
        mkdir -p ../V2rayNG/app/libs
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o ../V2rayNG/app/libs/libv2ray.aar ./
        unzip -l ../V2rayNG/app/libs/libv2ray.aar | grep -E 'classes.jar|libgojni.so|geoip.dat|geosite.dat'

    - name: Save libv2ray
      if: steps.cache-libv2ray-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar
        key: libv2ray-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}-${{ hashFiles('echfetch/echfetch.go') }}

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Unit tests (compiles everything; runs before the keystore so a push without secrets still tells)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set -o pipefail
        ./gradlew :app:testDirectDebugUnitTest --tests 'com.v2ray.ang.handler.*' --tests 'com.v2ray.ang.ui.*' 2>&1 | tee "$RUNNER_TEMP/unit-test.log"   # the fork's tests; upstream's UtilsTest needs Android stubs

    # The server that writes this code cannot compile it or read a job's log (that needs a GitHub login): when the Go
    # tests, the compile or the unit tests fail, their error lines go into a comment on the commit, which anyone can
    # read. Nothing after this point is reported that way — the later steps have the signing passwords on their lines.
    - name: Report a failed test or compile where it can be read without logging in
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        {
          echo "## Build ${{ github.run_number }} failed"
          echo
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f "$RUNNER_TEMP/go-test.log" ]; then
            echo; echo "### Go tests (echfetch)"; echo '```'
            grep -E "FAIL|panic:|\.go:[0-9]+|^ok|vet:" "$RUNNER_TEMP/go-test.log" | head -60
            echo '```'
          fi
          if [ -f "$RUNNER_TEMP/unit-test.log" ]; then
            echo; echo "### Compile and unit tests"; echo '```'
            grep -E "^e: |^w: .*deprecat|error:|FAILED|AssertionError|Exception|expected:<|What went wrong|BUILD (SUCCESSFUL|FAILED)|tests? completed" "$RUNNER_TEMP/unit-test.log" \
              | sed "s#file://$GITHUB_WORKSPACE/##g; s#$GITHUB_WORKSPACE/##g" | head -80
            echo '```'
          fi
        } > "$RUNNER_TEMP/comment.md"
        gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null && echo "commit comment posted"

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore           # the Ethavpn key: the direct APKs' original signer (and still theirs on Android 7-8)
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Decode the Allion keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: allion_keystore            # the Allion LLC key: Google Play's upload key; the direct APKs' signer on Android 9+
      with:
        fileName: "allion_keystore.jks"
        encodedString: ${{ secrets.ALLION_KEYSTORE_BASE64 }}

    - name: Build the direct APKs and the Play bundle
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew licenseDirectReleaseReport
        # the direct APKs: built with the Ethavpn key, then re-signed with the rotation in the next step
        ./gradlew assembleDirectRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
        # the Play bundle: the Allion key, Google Play's upload key
        ./gradlew bundlePlayRelease -Pandroid.injected.signing.store.file=${{ steps.allion_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.ALLION_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ALLION_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.ALLION_KEY_PASSWORD }}

    - name: Sign the direct APKs with key rotation (Ethavpn to Allion) and check both keys
      env:
        ETH_STORE_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        ETH_KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
        ALLION_STORE_PASS: ${{ secrets.ALLION_KEYSTORE_PASSWORD }}
        ALLION_KEY_PASS: ${{ secrets.ALLION_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        AS=$ANDROID_HOME/build-tools/37.0.0/apksigner
        OUT=${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release
        ETH="--ks ${{ steps.android_keystore.outputs.filePath }} --ks-key-alias ${{ secrets.APP_KEYSTORE_ALIAS }} --ks-pass env:ETH_STORE_PASS --key-pass env:ETH_KEY_PASS"
        ALLION="--ks ${{ steps.allion_keystore.outputs.filePath }} --ks-key-alias ${{ secrets.ALLION_KEY_ALIAS }} --ks-pass env:ALLION_STORE_PASS --key-pass env:ALLION_KEY_PASS"
        # the keys this app has always been signed with; anything else fails the build
        OLD=f7cb08e1fa300fca877ee03ee3f6f6b577af3850ddf551ceef23b5b11623f6fc   # Ethavpn, since 1.1.1
        NEW=7174bbcda3e8378b40fb3c528fc84a03974ed2af09aabc97d0a3d357946b3653   # Allion LLC
        # the proof that the Ethavpn key hands over to the Allion key: public certificates and the old key's signature
        $AS rotate --out "$RUNNER_TEMP/skyray.lineage" --old-signer $ETH --new-signer $ALLION
        $AS lineage --in "$RUNNER_TEMP/skyray.lineage" --print-certs
        for f in "$OUT"/SkyRay_*.apk; do
          $AS sign --in "$f" --out "$f.rotated" $ETH --next-signer $ALLION \
            --lineage "$RUNNER_TEMP/skyray.lineage" --rotation-min-sdk-version 28
          mv "$f.rotated" "$f"
          # Android 7-8 (API 24-27) must see the Ethavpn key, Android 9+ the Allion key with the proof.
          # (Output read into variables first: `| grep -q` under pipefail can fail a good build on SIGPIPE.)
          OLD_SDK=$($AS verify --min-sdk-version 24 --max-sdk-version 27 --print-certs "$f" | tr '[:upper:]' '[:lower:]')
          NEW_SDK=$($AS verify --min-sdk-version 28 --print-certs "$f" | tr '[:upper:]' '[:lower:]')
          PROOF=$($AS lineage --in "$f" --print-certs | tr '[:upper:]' '[:lower:]')
          # on failure the annotation carries apksigner's certificate lines (public; the job log needs a login)
          digests() { printf '%s' "$1" | grep 'sha-256 digest' | sed -E 's/certificate //' | tr '\n' ';' || true; }
          [[ "$OLD_SDK" == *"sha-256 digest: $OLD"* ]] || { echo "::error::$(basename "$f"): Android 7-8 do not see the Ethavpn key; apksigner: $(digests "$OLD_SDK")"; exit 1; }
          [[ "$NEW_SDK" == *"sha-256 digest: $NEW"* ]] || { echo "::error::$(basename "$f"): Android 9+ do not see the Allion key; apksigner: $(digests "$NEW_SDK")"; exit 1; }
          [[ "$PROOF" == *"$OLD"* && "$PROOF" == *"$NEW"* ]] || { echo "::error::$(basename "$f"): the rotation proof is missing a key; apksigner: $(digests "$PROOF")"; exit 1; }
        done
        echo "direct APKs: Ethavpn for Android 7-8, Allion (rotated from Ethavpn) for Android 9+"

    - name: Write latest.json and the signing certificate fingerprint
      run: |
        set -euo pipefail
        OUT=${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release
        cd "$OUT"
        VERSION=$(grep -oP 'versionName = "\K[^"]+' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts)
        CODE=$(grep -oP 'versionCode = \K[0-9]+' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts)
        MIN=$(tr -d ' \n' < ${{ github.workspace }}/min_supported.txt 2>/dev/null || echo "$VERSION")
        NOTES=$( (cat ${{ github.workspace }}/RELEASE_NOTES.md 2>/dev/null || true) | head -c 1500 | jq -Rs .)
        # R8's mapping file, for reading obfuscated stack traces of this exact build
        cp ${{ github.workspace }}/V2rayNG/app/build/outputs/mapping/directRelease/mapping.txt "SkyRay_${VERSION}_mapping.txt"
        ASSETS=$(for f in SkyRay_*.apk; do
          abi=${f#SkyRay_${VERSION}_}; abi=${abi%.apk}      # arm64-v8a, armeabi-v7a, x86, x86_64, universal
          printf '{"abi":"%s","name":"%s","size":%s,"sha256":"%s"}\n' "$abi" "$f" "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
        done | jq -s .)
        jq -n --arg v "$VERSION" --argjson c "$CODE" --arg p "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg m "$MIN" --argjson n "$NOTES" --argjson a "$ASSETS" \
          '{version:$v, versionCode:$c, published:$p, min_supported:$m, notes:$n, assets:$a}' > latest.json
        cat latest.json
        # the release certificates' SHA-256, both (Ethavpn for Android 7-8, Allion for Android 9+): both go into
        # assetlinks.json on the server (App Links); one per line
        $ANDROID_HOME/build-tools/37.0.0/apksigner lineage --in SkyRay_${VERSION}_arm64-v8a.apk --print-certs \
          | grep -i 'SHA-256 digest' | sed -E 's/.*: *//' | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//' > signing-cert-sha256.txt
        echo "signing cert sha256 (Android 7-8, then 9+): $(tr '\n' ' ' < signing-cert-sha256.txt)"
        # the Play bundle, next to the APKs (not in latest.json: the server never serves it)
        cp ${{ github.workspace }}/V2rayNG/app/build/outputs/bundle/playRelease/app-play-release.aab "SkyRay_${VERSION}_play.aab"
        echo "play bundle sha256: $(sha256sum SkyRay_${VERSION}_play.aab | cut -d' ' -f1)"
        echo "Play bundle SkyRay_${VERSION}_play.aab SHA-256: \`$(sha256sum SkyRay_${VERSION}_play.aab | cut -d' ' -f1)\`" >> $GITHUB_STEP_SUMMARY
        echo "### EthaVPN $VERSION" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY; cat latest.json >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
        echo "Signing certificates SHA-256 (Android 7-8, then 9+): \`$(tr '\n' ' ' < signing-cert-sha256.txt)\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload APKs and metadata
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: release-files
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/SkyRay_*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/SkyRay_*.aab
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/latest.json
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/signing-cert-sha256.txt
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/direct/release/SkyRay_*_mapping.txt

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Sign the APKs, the Play bundle and latest.json
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          # a key with a passphrase: GPG_PASSPHRASE secret; without one the variable is empty
          PASS_ARGS=()
          if [ -n "$GPG_PASSPHRASE" ]; then PASS_ARGS=(--pinentry-mode loopback --passphrase-fd 3); fi
          mkdir -p release-files
          for f in release/SkyRay_*.apk release/SkyRay_*.aab release/latest.json release/SkyRay_*_mapping.txt; do
            cp "$f" release-files/
            gpg --batch --yes "${PASS_ARGS[@]}" --local-user "$KEY" --detach-sign --output "release-files/$(basename "$f").sig" "$f" 3<<<"$GPG_PASSPHRASE"
          done
          cp release/signing-cert-sha256.txt release-files/
          gpg --armor --export "$KEY" > release-files/ethavpn-release-key.asc
          echo "release key fingerprint: $KEY" | tee release-files/release-key-fingerprint.txt
          ls -la release-files

      - name: Upload to the GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: false
